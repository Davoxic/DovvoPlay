name: Build IPA (unsigned)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "scripts/probe_sources.py"
      - ".github/workflows/probe.yml"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version
          sw_vers

      - name: Ensure iOS platform files
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create . --org com.dchietti --project-name sborraplay --platforms ios
          cp pubspec.yaml.bak pubspec.yaml
          rm pubspec.yaml.bak

      - name: Install dependencies
        run: flutter pub get

      - name: Configure iOS project (signing disabled & permissions)
        run: python3 scripts/configure_ios.py

      - name: Build iOS (Release, no code signing)
        run: |
          set -o pipefail
          export LANG=en_US.UTF-8
          flutter build ios --release --no-codesign

      - name: Package into .ipa
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Runner.app non trovata in $APP_PATH"
            find build -name "*.app" -maxdepth 6 -print || true
            exit 1
          fi
          rm -rf Payload SborraPlay-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/SborraPlay.app
          rm -rf "Payload/SborraPlay.app/_CodeSignature" "Payload/SborraPlay.app/embedded.mobileprovision"
          zip -qry SborraPlay-unsigned.ipa Payload
          ls -lh SborraPlay-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SborraPlay-unsigned-ipa
          path: SborraPlay-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Attach to GitHub Release (solo sui tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" SborraPlay-unsigned.ipa \
            --title "SborraPlay ${GITHUB_REF_NAME}" \
            --notes "Build unsigned. Firmala con Sideloadly / AltStore / ESign prima di installarla." \
            || gh release upload "${GITHUB_REF_NAME}" SborraPlay-unsigned.ipa --clobber

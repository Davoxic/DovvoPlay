name: Build IPA (unsigned)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "tools/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Native Swift IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Generate Xcode project if needed
        run: |
          python3 generate_xcodeproj.py

      - name: Build iOS App (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project DovvoPlay.xcodeproj \
            -scheme DovvoPlay \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES 2>&1 | tee build.log || {
              echo "::error::Xcode build failed!"
              tail -n 80 build.log
              echo "### Xcode Build Failure Log" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              tail -n 100 build.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            }

      - name: Package into .ipa
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData -name "DovvoPlay.app" -type d | head -n 1)"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::DovvoPlay.app non trovata in build/DerivedData"
            find build -name "*.app" -maxdepth 6 -print || true
            exit 1
          fi
          echo "Trovata app in: $APP_PATH"
          rm -rf Payload DovvoPlay-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/DovvoPlay.app
          rm -rf "Payload/DovvoPlay.app/_CodeSignature" "Payload/DovvoPlay.app/embedded.mobileprovision"
          zip -qry DovvoPlay-unsigned.ipa Payload
          ls -lh DovvoPlay-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DovvoPlay-unsigned-ipa
          path: DovvoPlay-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-build-log
          path: build.log
          if-no-files-found: ignore

      - name: Attach to GitHub Release (su tag v* o push su main)
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          if [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_REF_NAME" = "master" ]; then
            APP_VERSION="$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" DovvoPlay/Resources/Info.plist 2>/dev/null || echo "2.0.0")"
            if [ -n "$APP_VERSION" ]; then
              RELEASE_TAG="v${APP_VERSION}"
            else
              RELEASE_TAG="latest"
            fi
          fi
          echo "Tag della release: $RELEASE_TAG"

          gh release create "$RELEASE_TAG" DovvoPlay-unsigned.ipa \
            --title "DovvoPlay ${RELEASE_TAG}" \
            --notes "Build unsigned nativa Swift & SwiftUI generata da GitHub Actions. Firmala in locale con la tua app di firma preferita (ESign, Scarlet, Feather, Sideloadly, TrollStore)." \
            || gh release upload "$RELEASE_TAG" DovvoPlay-unsigned.ipa --clobber

          gh release edit "$RELEASE_TAG" --latest || true

name: dovvoplay
description: "Player musicale locale per iPhone con ricerca YouTube e streaming audio."
publish_to: "none"
version: 1.4.2+11

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  just_audio: ^0.9.46
  just_audio_background: ^0.0.1-beta.15
  audio_session: ^0.1.25
  youtube_explode_dart: ^3.1.0
  path_provider: ^2.1.5
  file_picker: ^8.1.7
  cached_network_image: ^3.4.1
  http: ^1.3.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/

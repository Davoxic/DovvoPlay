name: Build IPA (unsigned)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned .ipa
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build (Release, no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Sonora.xcodeproj \
            -scheme Sonora \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Package into .ipa
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/Sonora.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Sonora.app non trovata in $APP_PATH"
            find build -name "*.app" -maxdepth 6 -print || true
            exit 1
          fi
          rm -rf Payload Sonora-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # rimuove eventuali firme/placeholder lasciati dal build
          rm -rf "Payload/Sonora.app/_CodeSignature" "Payload/Sonora.app/embedded.mobileprovision"
          zip -qry Sonora-unsigned.ipa Payload
          ls -lh Sonora-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sonora-unsigned-ipa
          path: Sonora-unsigned.ipa
          if-no-files-found: error
          retention-days: 90

      - name: Attach to GitHub Release (solo sui tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" Sonora-unsigned.ipa \
            --title "Sonora ${GITHUB_REF_NAME}" \
            --notes "Build unsigned. Firmala con Sideloadly / AltStore / ESign prima di installarla." \
            || gh release upload "${GITHUB_REF_NAME}" Sonora-unsigned.ipa --clobber

name: Probe sorgenti

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe*.py"
      - "scripts/TryPlay.swift"
      - ".github/workflows/probe.yml"

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regola di scelta nuova, su cinque ricerche
        run: python3 scripts/probe3.py
      - name: AVPlayer prova il flusso HLS in chiaro
        run: swift scripts/TryPlay.swift "$(cat /tmp/sc_hls.txt 2>/dev/null || echo '')"
      - name: AVPlayer prova il flusso progressive
        run: swift scripts/TryPlay.swift "$(cat /tmp/sc_prog.txt 2>/dev/null || echo '')"

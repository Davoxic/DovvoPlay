name: Probe sorgenti

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe*.py"
      - "scripts/TryPlay.swift"
      - ".github/workflows/probe.yml"

jobs:
  probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chiamate reali a SoundCloud, Piped e Invidious
        run: python3 scripts/probe2.py
      - name: AVPlayer prova davvero a riprodurre
        run: |
          URL=$(cat /tmp/sc_url.txt 2>/dev/null || echo "")
          swift scripts/TryPlay.swift "$URL"
